# .github/workflows/sast.yml
# Автоматический SAST-анализ: запускается при каждом push и pull request.
# Результаты: JSON-отчёт в артефактах + SARIF во вкладке Security → Code scanning.

name: SAST (Semgrep)

on:
  push:
  pull_request:

permissions:
  security-events: write   # для загрузки SARIF в Code scanning
  contents: read

jobs:
  semgrep:
    name: Semgrep scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Semgrep scan
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/owasp-top-ten
            p/security-audit
            p/javascript
            p/typescript
            p/secrets
          generateSarif: "1"

      - name: Upload SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif

      - name: Upload JSON report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep.sarif
