# .github/workflows/sast.yml
# Автоматический SAST-анализ: запускается при каждом push и pull request.
# Результаты: находки во вкладке Security → Code scanning + SARIF в артефактах.

name: SAST (Semgrep)

on:
  push:
  pull_request:

permissions:
  security-events: write   # для загрузки SARIF в Code scanning
  contents: read

jobs:
  semgrep:
    name: Semgrep scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: pip install semgrep

      # Наборы правил под классы уязвимостей из ТЗ.
      # "|| true": находки не роняют пайплайн — отчёт всё равно загрузится.
      - name: Run SAST scan
        run: |
          semgrep scan \
            --config=p/owasp-top-ten \
            --config=p/security-audit \
            --config=p/javascript \
            --config=p/typescript \
            --config=p/secrets \
            --metrics=off \
            --exclude=".github" --exclude="node_modules" --exclude="data/static/codefixes" \
            --sarif -o semgrep.sarif || true

      - name: Upload SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif

      - name: Upload SARIF report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep.sarif
